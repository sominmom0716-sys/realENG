<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E7C86">
<meta name="description" content="실전 생존 영어 표현을 카드로 익히는 학습 앱">
<title>생존 영어 표현 123</title>
  <link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root{
  --bg:#F2F5F4;
  --surface:#FFFFFF;
  --surface-2:#E7ECEA;
  --ink:#1F2933;
  --ink-soft:#5B6B70;
  --ink-faint:#8A9A9E;
  --accent:#0E7C86;
  --accent-ink:#FFFFFF;
  --accent-soft:#DBEEEE;
  --coral:#E4572E;
  --coral-soft:#FBE3DC;
  --good:#2F9E44;
  --good-soft:#E1F3E4;
  --border:#D7DFDD;
  --shadow:rgba(24,36,40,.10);
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1517;
    --surface:#182022;
    --surface-2:#1F2A2C;
    --ink:#E8EEEC;
    --ink-soft:#9FB0AE;
    --ink-faint:#6B7C7A;
    --accent:#57D6C9;
    --accent-ink:#07211F;
    --accent-soft:rgba(87,214,201,.14);
    --coral:#FF8A66;
    --coral-soft:rgba(255,138,102,.14);
    --good:#5FE08A;
    --good-soft:rgba(95,224,138,.14);
    --border:#293433;
    --shadow:rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1517;
  --surface:#182022;
  --surface-2:#1F2A2C;
  --ink:#E8EEEC;
  --ink-soft:#9FB0AE;
  --ink-faint:#6B7C7A;
  --accent:#57D6C9;
  --accent-ink:#07211F;
  --accent-soft:rgba(87,214,201,.14);
  --coral:#FF8A66;
  --coral-soft:rgba(255,138,102,.14);
  --good:#5FE08A;
  --good-soft:rgba(95,224,138,.14);
  --border:#293433;
  --shadow:rgba(0,0,0,.4);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Noto Sans KR',-apple-system,'Malgun Gothic',sans-serif;
  padding:0 max(16px, env(safe-area-inset-left,0px)) 0 max(16px, env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,.serif{font-family:'Fraunces','Noto Serif KR',serif;text-wrap:balance;}
.mono{font-family:'IBM Plex Mono',monospace;}
a{color:var(--accent);}
button{font:inherit;cursor:pointer;}
[hidden]{display:none!important;}

.app{max-width:760px;margin:0 auto;padding-bottom:48px;}

/* header */
header.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:var(--bg);
  padding:14px 0 10px;
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;}
.brand h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em;}
.brand .total{
  font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-soft);
  background:var(--surface-2);padding:4px 10px;border-radius:999px;white-space:nowrap;
}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  flex:0 0 auto;border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);
  padding:7px 14px;border-radius:999px;font-size:13.5px;font-weight:500;transition:.15s;
}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);}

.partbar{display:flex;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none;}
.partbar::-webkit-scrollbar{display:none;}
.chip{
  flex:0 0 auto;border:1px solid var(--border);background:var(--surface);
  padding:6px 12px;border-radius:10px;font-size:13px;color:var(--ink-soft);font-weight:500;
  display:flex;align-items:center;gap:6px;
}
.chip[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}
.chip .n{font-family:'IBM Plex Mono',monospace;font-size:11px;opacity:.75;}

main{padding-top:18px;}
section.view{display:flex;flex-direction:column;gap:18px;}

/* home */
.hero{
  background:linear-gradient(155deg,var(--surface),var(--surface-2));
  border:1px solid var(--border);border-radius:var(--radius);padding:22px 20px;
}
.hero p{color:var(--ink-soft);font-size:14.5px;line-height:1.6;margin:8px 0 0;}
.hero h2{font-size:19px;margin:0;}
.progress-row{display:flex;align-items:center;gap:12px;margin-top:16px;}
.progress-track{flex:1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;}
.progress-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .3s;}
.progress-label{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink-soft);white-space:nowrap;}

.partgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
@media (max-width:480px){.partgrid{grid-template-columns:1fr;}}
.partcard{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 15px;
  text-align:left;display:flex;flex-direction:column;gap:8px;
}
.partcard .idx{font-family:'IBM Plex Mono',monospace;color:var(--accent);font-size:12px;font-weight:600;}
.partcard h3{font-size:15px;margin:0;font-weight:600;}
.partcard .meta{font-size:12px;color:var(--ink-faint);}
.partcard .progress-track{height:6px;}
.partcard-actions{display:flex;gap:6px;margin-top:2px;}
.linkbtn{
  border:1px solid var(--border);background:var(--surface-2);color:var(--ink);
  border-radius:8px;padding:6px 9px;font-size:12px;font-weight:500;
}

/* study */
.studyhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
.studyhead h2{font-size:17px;margin:0;}
.studyhead .count{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-soft);}

.modetoggle{
  display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:12px;padding:4px;
}
.modebtn{
  flex:1;border:none;background:transparent;color:var(--ink-soft);border-radius:9px;
  padding:9px 6px;font-size:13.5px;font-weight:600;transition:.15s;
}
.modebtn[aria-selected="true"]{background:var(--surface);color:var(--accent);box-shadow:0 2px 6px var(--shadow);}

.stage{perspective:1400px;}
.card{
  position:relative;min-height:230px;border-radius:20px;cursor:pointer;
  transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.7,.3,1);
}
.card.flipped{transform:rotateY(180deg);}
.face{
  position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:28px 22px;border:1px solid var(--border);box-shadow:0 10px 30px -12px var(--shadow);
}
.face.front{background:var(--surface);}
.face.back{background:var(--accent-soft);transform:rotateY(180deg);}
.face .tag{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin-bottom:14px;}
.face .kr{font-family:'Noto Serif KR',serif;font-weight:700;font-size:20px;line-height:1.5;}
.en-row{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;}
.face .en{font-family:'Fraunces','Noto Serif KR',serif;font-weight:600;font-size:22px;line-height:1.4;color:var(--ink);}
.face .en-sub{margin-top:10px;font-family:'Noto Sans KR',sans-serif;font-size:14.5px;color:var(--ink-soft);}
.face .hint{position:absolute;bottom:14px;font-size:11.5px;color:var(--ink-faint);}
.speakbtn{
  flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--border);
  background:var(--surface);color:var(--accent);font-size:15px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px var(--shadow);
}
.speakbtn:active{transform:scale(.92);}

.controls{display:flex;gap:8px;}
.ctrlbtn{
  flex:1;border-radius:12px;border:1px solid var(--border);background:var(--surface);
  padding:12px 8px;font-size:14px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink);
}
.ctrlbtn small{font-size:11px;font-weight:500;color:var(--ink-faint);}
.ctrlbtn.no{color:var(--coral);}
.ctrlbtn.yes{color:var(--good);}
.navrow{display:flex;gap:8px;justify-content:center;}
.iconbtn{
  border:1px solid var(--border);background:var(--surface);border-radius:10px;
  width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:16px;
}
.shufflebtn{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:12.5px;color:var(--ink-soft);font-weight:500;}

.expWrap{display:flex;flex-direction:column;gap:10px;}
.expPanel{
  border:1px solid var(--border);border-left:4px solid var(--accent);background:var(--surface);border-radius:0 14px 14px 0;padding:14px 16px;
  display:flex;flex-direction:column;gap:8px;
}
.expLabel{font-size:11.5px;letter-spacing:.04em;color:var(--ink-faint);font-weight:600;text-transform:uppercase;}
.expRow{display:flex;align-items:center;gap:10px;}
.expTxt{flex:1;min-width:0;}
.expEn{font-family:'Fraunces','Noto Serif KR',serif;font-weight:600;font-size:15.5px;color:var(--ink);line-height:1.45;}
.expKr{font-size:13px;color:var(--ink-soft);margin-top:4px;}
.speakbtn.small{width:30px;height:30px;font-size:13px;flex:0 0 auto;}

/* list */
.searchbar{
  display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:9px 12px;
}
.searchbar input{border:none;outline:none;background:transparent;color:var(--ink);font-size:14px;width:100%;font-family:inherit;}
.searchbar input::placeholder{color:var(--ink-faint);}
.filterrow{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink-soft);}
.filterrow label{display:flex;gap:5px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:5px 9px;}

.list{display:flex;flex-direction:column;gap:6px;}
.item{
  display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:11px 13px;
}
.item .no{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-faint);width:22px;flex:0 0 auto;}
.item .txt{flex:1;min-width:0;}
.item .en{font-weight:600;font-size:14.5px;}
.expBadge{font-size:11px;opacity:.75;}
.item .kr{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
.item .speak{
  flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:1px solid var(--border);
  background:var(--surface-2);color:var(--accent);font-size:13px;display:flex;align-items:center;justify-content:center;
}
.item .check{flex:0 0 auto;width:26px;height:26px;border-radius:8px;border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;color:var(--surface);font-size:14px;background:var(--surface-2);}
.item .check.on{background:var(--good);border-color:var(--good);color:#fff;}
.empty{color:var(--ink-faint);font-size:13.5px;text-align:center;padding:24px 0;}

footer.note{color:var(--ink-faint);font-size:12px;text-align:center;padding:22px 0 10px;line-height:1.6;}

/* gate */
.gateOverlay{
  position:fixed;inset:0;z-index:999;
  background:radial-gradient(120% 100% at 50% -10%, var(--accent-soft), var(--bg) 60%);
  display:flex;align-items:center;justify-content:center;padding:20px;
  padding-top:max(20px, env(safe-area-inset-top,0px));
}
.gateCard{
  width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);
  border-radius:22px;padding:32px 26px 28px;box-shadow:0 20px 50px -18px var(--shadow);
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;
}
.gateBadge{
  width:52px;height:52px;border-radius:16px;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:10px;
}
.gateCard h2{font-size:20px;margin:0;line-height:1.35;}
.gateCard .sub{color:var(--ink-soft);font-size:13.5px;line-height:1.6;margin:6px 0 22px;}
.gateForm{display:flex;flex-direction:column;gap:10px;width:100%;}
.gateInput{
  width:100%;border:1px solid var(--border);background:var(--surface-2);color:var(--ink);
  border-radius:12px;padding:13px 14px;font-size:15px;font-family:inherit;text-align:center;
  letter-spacing:.02em;outline:none;transition:.15s;
}
.gateInput:focus{border-color:var(--accent);background:var(--surface);}
.gateBtn{
  width:100%;border:none;background:var(--accent);color:var(--accent-ink);
  border-radius:12px;padding:13px 14px;font-size:15px;font-weight:700;
}
.gateBtn:active{transform:scale(.98);}
.gateErr{color:var(--coral);font-size:12.5px;font-weight:600;min-height:16px;}
.gateFoot{color:var(--ink-faint);font-size:11.5px;margin-top:18px;line-height:1.6;}
</style>


</head>
<body>
<div class="gateOverlay" id="gateOverlay">
  <div class="gateCard">
    <div class="gateBadge">🔐</div>
    <h2 class="serif">생존 영어 표현 123</h2>
    <p class="sub">구독자를 위한 프라이빗 학습 앱이에요.<br>받으신 접속 코드를 입력해주세요.</p>
    <form class="gateForm" id="gateForm" autocomplete="off">
      <input class="gateInput" id="gateInput" type="text" inputmode="text" placeholder="접속 코드" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      <div class="gateErr" id="gateErr"></div>
      <button class="gateBtn" type="submit">입장하기</button>
    </form>
    <div class="gateFoot">코드는 이 브라우저에만 저장되며,<br>다른 사람에게 공유하지 말아주세요 🙏</div>
  </div>
</div>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>생존 영어 표현 <span class="mono" style="color:var(--accent)">123</span></h1>
      <span class="total mono" id="totalBadge">0 / 123</span>
    </div>
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" data-view="home" aria-selected="true">홈</button>
      <button class="tab" data-view="study" aria-selected="false">학습</button>
      <button class="tab" data-view="list" aria-selected="false">전체 목록</button>
    </div>
    <div class="partbar" id="partbar"></div>
  </header>

  <main>
    <section class="view" id="view-home"></section>
    <section class="view" id="view-study" hidden>
      <div class="studyhead"><h2 class="serif" id="studyTitle">학습</h2></div>
      <div class="modetoggle" id="modeToggle" role="tablist">
        <button class="modebtn" data-mode="expr" aria-selected="true">📝 표현 카드</button>
        <button class="modebtn" data-mode="situation" aria-selected="false">🎬 상황 카드</button>
      </div>
      <div id="studyBody"></div>
    </section>
    <section class="view" id="view-list" hidden></section>
  </main>

  <footer class="note">카드를 눌러 뒤집고, 🔊를 눌러 발음을 들어보세요.<br>기록은 이 브라우저에만 저장돼요.</footer>
</div>

// ---- access gate ----
var GATE_KEY = "survival-eng-123-access";
var GATE_CODE = "Grace1203";
(function(){
  var overlay = document.getElementById("gateOverlay");
  var form = document.getElementById("gateForm");
  var input = document.getElementById("gateInput");
  var err = document.getElementById("gateErr");
  if(!overlay || !form) return;
  var unlocked = false;
  try{ unlocked = localStorage.getItem(GATE_KEY) === "granted"; }catch(e){ unlocked = false; }
  if(unlocked){
    overlay.hidden = true;
    return;
  }
  setTimeout(function(){ try{ input.focus(); }catch(e){} }, 50);
  form.addEventListener("submit", function(e){
    e.preventDefault();
    var val = (input.value || "").trim().replace(/\s+/g,"");
    if(val.toLowerCase() === GATE_CODE.toLowerCase()){
      try{ localStorage.setItem(GATE_KEY, "granted"); }catch(e){}
      overlay.style.transition = "opacity .25s ease";
      overlay.style.opacity = "0";
      setTimeout(function(){ overlay.hidden = true; }, 250);
    }else{
      err.textContent = "코드가 올바르지 않아요. 다시 확인해주세요.";
      input.value = "";
      input.focus();
    }
  });
})();

// ---- speech ----
var voicesReady = false;
if(window.speechSynthesis){
  window.speechSynthesis.onvoiceschanged = function(){ voicesReady = true; };
}
function speak(text){
  try{
    if(!window.speechSynthesis) return;
    var clean = String(text).replace(/\s*\/\s*/g, ", or ").replace(/\[|\]/g,"");
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(clean);
    u.lang = "en-US";
    u.rate = 0.92;
    u.pitch = 1;
    var voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
    var en = voices.filter(function(v){ return /^en/i.test(v.lang); });
    if(en.length){
      var us = en.filter(function(v){ return /US/i.test(v.lang); });
      u.voice = us[0] || en[0];
    }
    window.speechSynthesis.speak(u);
  }catch(e){}
}

var known = {};
try{
  var raw = localStorage.getItem(STORE_KEY);

function saveKnown(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(known)); }catch(e){}

function itemsForPart(p){
  if(p === "all") return ITEMS.slice();
  return ITEMS.filter(function(it){ return it.part === p; });
}
function situationsForPart(p){
  if(p === "all") return SITUATIONS.slice();
  return SITUATIONS.filter(function(s){ return s.part === p; });
}
function shuffled(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function partTitle(p){
  if(p === "all") return "전체";
  var m = PARTS.filter(function(x){return x.id===p;})[0];
  return m ? ("Part "+m.id+" · "+m.title) : "";
}

// ---- render: header tabs ----
document.getElementById("tabs").addEventListener("click", function(e){
  var btn = e.target.closest(".tab");
  if(!btn) return;
  goToView(btn.getAttribute("data-view"));
});
function goToView(view){
  state.view = view;
  document.querySelectorAll(".tab").forEach(function(t){ t.setAttribute("aria-selected", t.getAttribute("data-view")===view ? "true":"false"); });
  document.querySelectorAll("section.view").forEach(function(v){ v.hidden = true; });
  document.getElementById("view-"+view).hidden = false;
  render();
}

// ---- part bar ----
var partbarEl = document.getElementById("partbar");
function renderPartbar(){
  var html = '';
  PARTS.forEach(function(p){
    var cnt = ITEMS.filter(function(it){return it.part===p.id;}).length;
    html += '<button class="chip" data-part="'+p.id+'"><b>P'+p.id+'</b> '+p.short+' <span class="n">'+cnt+'</span></button>';
  });
  html += '<button class="chip" data-part="all">전체 <span class="n">123</span></button>';
  partbarEl.innerHTML = html;
  syncPartbar();
  partbarEl.querySelectorAll(".chip").forEach(function(btn){
    btn.addEventListener("click", function(){
      var v = btn.getAttribute("data-part");
      state.part = (v === "all") ? "all" : parseInt(v,10);
      resetFlash(); resetSituation();
      render();
    });
  });
}
function syncPartbar(){
  partbarEl.querySelectorAll(".chip").forEach(function(btn){
    var v = btn.getAttribute("data-part");
    var match = (v === "all" && state.part === "all") || (parseInt(v,10) === state.part);
    btn.setAttribute("aria-selected", match ? "true" : "false");
  });
  partbarEl.hidden = (state.view === "home");
}

// ---- mode toggle (표현카드 / 상황카드) ----
document.getElementById("modeToggle").addEventListener("click", function(e){
  var btn = e.target.closest(".modebtn");
  if(!btn) return;
  state.studyMode = btn.getAttribute("data-mode");
  state.flipped = false;
  state.expOpen = false;
  document.querySelectorAll("#modeToggle .modebtn").forEach(function(b){
    b.setAttribute("aria-selected", b===btn ? "true":"false");
  });
  renderStudyBody();
});

      + '<div class="progress-track"><div class="progress-fill" style="width:'+pc+'%"></div></div>'
      + '<div class="partcard-actions">'
      + '<button class="linkbtn" data-mode="expr" data-part="'+p.id+'">📝 표현 카드</button>'
      + '<button class="linkbtn" data-mode="situation" data-part="'+p.id+'">🎬 상황 카드</button>'
      + '</div></div>';
  });
  html += '</div>';
  homeEl.innerHTML = html;

  homeEl.querySelectorAll("[data-mode]").forEach(function(btn){
    btn.addEventListener("click", function(){
      state.part = parseInt(btn.getAttribute("data-part"),10);
      state.studyMode = btn.getAttribute("data-mode");
      resetFlash(); resetSituation();
      document.querySelectorAll("#modeToggle .modebtn").forEach(function(b){
        b.setAttribute("aria-selected", b.getAttribute("data-mode")===state.studyMode ? "true":"false");
      });
      goToView("study");
    });
  });
}

// ---- STUDY (표현 카드 + 상황 카드, 같은 화면에서 전환) ----
var studyBodyEl = document.getElementById("studyBody");
function resetFlash(){
  state.flashOrder = shuffled(itemsForPart(state.part).map(function(it){return it.id;}));
  state.flashIdx = 0;
  state.flipped = false;
  state.expOpen = false;
}
function currentFlashItem(){
  var pool = itemsForPart(state.part);
  var id = state.flashOrder[state.flashIdx];
  return pool.filter(function(it){return it.id===id;})[0] || pool[0];
}
function resetSituation(){
  state.sitOrder = shuffled(situationsForPart(state.part).map(function(s){return s.id;}));
  state.sitIdx = 0;
  state.flipped = false;
  state.expOpen = false;
}
function currentSit(){
  var pool = situationsForPart(state.part);
  var id = state.sitOrder[state.sitIdx];
  return pool.filter(function(s){return s.id===id;})[0] || pool[0];
}

function renderStudyBody(){
  document.getElementById("studyTitle").textContent = partTitle(state.part) + " 학습";
  if(state.studyMode === "situation") renderSituation();
  else renderFlash();
}

function renderFlash(){
  var pool = itemsForPart(state.part);
  if(pool.length === 0){ studyBodyEl.innerHTML = '<p class="empty">표현이 없어요.</p>'; return; }
  if(state.flashOrder.length !== pool.length) resetFlash();
  var it = currentFlashItem();
  var exp = expansionFor(it.en);
  var html = '';
  html += '<div class="studyhead"><span class="tag" style="color:var(--ink-soft);font-size:12.5px;">뜻을 보고 영어를 떠올려보세요</span><span class="count mono">'+(state.flashIdx+1)+' / '+pool.length+'</span></div>';
  html += '<div class="stage"><div class="card'+(state.flipped?' flipped':'')+'" id="flashCard">'
    + '<div class="face front"><span class="tag">뜻</span>'
    + '<div class="kr">'+escapeHtml(it.kr)+'</div>'
    + '<span class="hint">👆 눌러서 뒤집기</span></div>'
    + '<div class="face back"><span class="tag">정답</span>'
    + '<div class="en-row"><span class="en">'+escapeHtml(it.en)+'</span><button class="speakbtn" id="flashSpeak" aria-label="발음 듣기">🔊</button></div>'
    + '<div class="en-sub">'+escapeHtml(it.kr)+'</div>'
    + '<span class="hint">👆 눌러서 다시 뒤집기</span></div>'
    + '</div></div>';
  html += renderExpansionBlock(exp, "flashExp");
  html += '<div class="navrow"><button class="iconbtn" id="flashPrev">←</button>'
    + '<button class="shufflebtn" id="flashShuffle">🔀 섞기</button>'
    + '<button class="iconbtn" id="flashNext">→</button></div>';
  studyBodyEl.innerHTML = html;

  document.getElementById("flashCard").addEventListener("click", function(){
    state.flipped = !state.flipped;
    state.expOpen = false;
    renderFlash();
  });
  var speakBtn = document.getElementById("flashSpeak");
  if(speakBtn) speakBtn.addEventListener("click", function(e){ e.stopPropagation(); speak(it.en); });
  document.getElementById("flashPrev").addEventListener("click", function(){ stepFlash(-1); });
  document.getElementById("flashNext").addEventListener("click", function(){ stepFlash(1); });
  document.getElementById("flashShuffle").addEventListener("click", function(){ resetFlash(); renderFlash(); });
  wireExpansionBlock(exp, "flashExp");
}
function stepFlash(dir){
  var pool = itemsForPart(state.part);
  state.flashIdx = (state.flashIdx + dir + pool.length) % pool.length;
  state.flipped = false;
  state.expOpen = false;
  renderFlash();
}

function renderSituation(){
  var pool = situationsForPart(state.part);
  if(pool.length === 0){ studyBodyEl.innerHTML = '<p class="empty">상황이 없어요.</p>'; return; }
  if(state.sitOrder.length !== pool.length) resetSituation();
  var s = currentSit();
  var exp = expansionFor(s.en);
  var html = '';
  html += '<div class="studyhead"><span class="tag" style="color:var(--ink-soft);font-size:12.5px;">이럴 때, 뭐라고 말할까요?</span><span class="count mono">'+(state.sitIdx+1)+' / '+pool.length+'</span></div>';
  html += '<div class="stage"><div class="card'+(state.flipped?' flipped':'')+'" id="sitCard">'
    + '<div class="face front"><span class="tag">상황</span>'
    + '<div class="kr">'+escapeHtml(s.kr)+'</div>'
    + '<span class="hint">👆 눌러서 뒤집기</span></div>'
    + '<div class="face back"><span class="tag">정답 표현</span>'
    + '<div class="en-row"><span class="en">'+escapeHtml(s.en)+'</span><button class="speakbtn" id="sitSpeak" aria-label="발음 듣기">🔊</button></div>'
    + '<div class="en-sub">'+escapeHtml(s.sub)+'</div>'
    + '<span class="hint">👆 눌러서 다시 뒤집기</span></div>'
    + '</div></div>';
  html += renderExpansionBlock(exp, "sitExp");
  html += '<div class="navrow" style="margin-top:4px;"><button class="iconbtn" id="sitPrev">←</button>'
    + '<button class="shufflebtn" id="sitShuffle">🔀 섞기</button>'
    + '<button class="iconbtn" id="sitNext">→</button></div>';
  studyBodyEl.innerHTML = html;

  document.getElementById("sitCard").addEventListener("click", function(){
    state.flipped = !state.flipped;
    state.expOpen = false;
    renderSituation();
  });
  var speakBtn = document.getElementById("sitSpeak");
  if(speakBtn) speakBtn.addEventListener("click", function(e){ e.stopPropagation(); speak(s.en); });
  document.getElementById("sitPrev").addEventListener("click", function(){ stepSit(-1); });
  document.getElementById("sitNext").addEventListener("click", function(){ stepSit(1); });
  document.getElementById("sitShuffle").addEventListener("click", function(){ resetSituation(); renderSituation(); });
  wireExpansionBlock(exp, "sitExp");
}
function stepSit(dir){
  var pool = situationsForPart(state.part);
  state.sitIdx = (state.sitIdx + dir + pool.length) % pool.length;
  state.flipped = false;
  state.expOpen = false;
  renderSituation();
}

// ---- expansion block (shared by flash & situation cards) : shown right under the answer, no extra click ----
function renderExpansionBlock(exp, prefix){
  if(!exp || !state.flipped) return '';
  var html = '<div class="expWrap">'
    + '<div class="expPanel">'
    + '<div class="expLabel">✏️ 표현 확장하기</div>'
    + '<div class="expRow"><div class="expTxt"><div class="expEn">'+escapeHtml(exp.en)+'</div><div class="expKr">'+escapeHtml(exp.kr)+'</div></div>'
    + '<button class="speakbtn small" id="'+prefix+'Speak" aria-label="발음 듣기">🔊</button></div>'
    + '</div></div>';
  return html;
}
function wireExpansionBlock(exp, prefix){
  if(!exp || !state.flipped) return;
  var sp = document.getElementById(prefix+"Speak");
  if(sp) sp.addEventListener("click", function(e){ e.stopPropagation(); speak(exp.en); });
}

// ---- LIST ----
var listEl = document.getElementById("view-list");
function renderList(){
  var pool = itemsForPart(state.part);
  var q = state.listQuery.trim().toLowerCase();
  if(q){
    pool = pool.filter(function(it){
      return it.en.toLowerCase().indexOf(q) > -1 || it.kr.indexOf(q) > -1;
    });
  }
  if(state.listUnknownOnly){
    pool = pool.filter(function(it){ return !isKnown(it.id); });
  }
  var html = '';
  html += '<div class="searchbar">🔎 <input type="text" id="listSearch" placeholder="영어나 한국어로 검색" value="'+escapeAttr(state.listQuery)+'"></div>';
  html += '<div class="filterrow"><label><input type="checkbox" id="listUnknown" '+(state.listUnknownOnly?'checked':'')+'> 모르는 표현만 보기</label>'
    + '<span class="mono" style="margin-left:auto;">'+pool.length+'개</span></div>';
  html += '<div class="list" id="listBody">';
  if(pool.length===0){
    html += '<p class="empty">해당하는 표현이 없어요.</p>';
  }else{
    pool.forEach(function(it, i){
      var k = isKnown(it.id);
      var hasExp = !!expansionFor(it.en);
      html += '<div class="item">'
        + '<span class="no mono">'+(i+1)+'</span>'
        + '<div class="txt"><div class="en">'+escapeHtml(it.en)+(hasExp?' <span class="expBadge" title="확장 문장 있음">🔎</span>':'')+'</div><div class="kr">'+escapeHtml(it.kr)+'</div></div>'
        + '<button class="speak" data-id="'+it.id+'" aria-label="발음 듣기">🔊</button>'
        + '<button class="check'+(k?' on':'')+'" data-id="'+it.id+'">'+(k?'✓':'')+'</button>'
        + '</div>';
    });
  }
  html += '</div>';
  listEl.innerHTML = html;

  document.getElementById("listSearch").addEventListener("input", function(){
    state.listQuery = this.value;
    renderList();
    var el = document.getElementById("listSearch");
    el.focus();
    el.setSelectionRange(el.value.length, el.value.length);
  });
  document.getElementById("listUnknown").addEventListener("change", function(){
    state.listUnknownOnly = this.checked;
    renderList();
  });
  listEl.querySelectorAll(".speak").forEach(function(btn){
    btn.addEventListener("click", function(){
      var id = btn.getAttribute("data-id");
      var item = ITEMS.filter(function(x){return x.id===id;})[0];
      if(item) speak(item.en);
    });
  });
  listEl.querySelectorAll(".check").forEach(function(btn){
    btn.addEventListener("click", function(){
      var id = btn.getAttribute("data-id");
      setKnown(id, !isKnown(id));
      renderList();
    });
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function escapeAttr(s){ return escapeHtml(s); }

function refreshBadges(){
  var masteredTotal = ITEMS.filter(function(it){return isKnown(it.id);}).length;
  document.getElementById("totalBadge").textContent = masteredTotal+" / "+ITEMS.length;
}

function render(){
  syncPartbar();
  refreshBadges();
  if(state.view === "home") renderHome();
  else if(state.view === "study") renderStudyBody();
  else if(state.view === "list") renderList();
}

renderPartbar();
resetFlash();
resetSituation();
render();

})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</body>
